<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: marketing-navy.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-masthead region text" data-region="masthead"><!-- White OpenObec wordmark --><p style="font-size:var(--r-masthead-font);line-height:1.05;margin:0">masthead</p></div>
  <div class="r-nav-benefits region control" data-region="nav-benefits"><!-- Výhody navigation link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-benefits); a control need not have button chrome --></div>
  <div class="r-nav-contact region control" data-region="nav-contact"><!-- Kontakt navigation link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-contact); a control need not have button chrome --></div>
  <div class="r-nav-demo region control" data-region="nav-demo"><!-- White Otvoriť demo button with small arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-demo); a control need not have button chrome --></div>
  <div class="r-headline region text" data-region="headline"><!-- White two-line headline Dokumenty obce jednoducho dostupné. --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-intro region text" data-region="intro"><!-- Two-line white support text about citizens and officials --><p style="font-size:var(--r-intro-font);line-height:1.05;margin:0">intro</p></div>
  <div class="r-citizen-demo region control" data-region="citizen-demo"><!-- Blue Občianske demo button with arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop citizen-demo); a control need not have button chrome --></div>
  <div class="r-office-demo region control" data-region="office-demo"><!-- White Demo pre úradníka button with arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop office-demo); a control need not have button chrome --></div>
  <figure class="r-skyline region plate" data-region="skyline"><img src="../../../assets/plates/skyline.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-register-panel region chrome" data-region="register-panel"><!-- White rounded interface container for semantic search and table --></div>
  <div class="r-search-heading region text" data-region="search-heading"><!-- Vyhľadať dokumenty heading inside register panel --><p style="font-size:var(--r-search-heading-font);line-height:1.05;margin:0">search-heading</p></div>
  <div class="r-sample-label region text" data-region="sample-label"><!-- Ukážkové dáta · Žilina label --><p style="font-size:var(--r-sample-label-font);line-height:1.05;margin:0">sample-label</p></div>
  <div class="r-search-input region control" data-region="search-input"><!-- White search input with magnifying glass and placeholder: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop search-input); a control need not have button chrome --></div>
  <div class="r-search-button region control" data-region="search-button"><!-- Blue Hľadať search button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop search-button); a control need not have button chrome --></div>
  <div class="r-agenda-tabs region control" data-region="agenda-tabs"><!-- Six agenda tabs with Faktúry active, underline only under active tab: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop agenda-tabs); a control need not have button chrome --></div>
  <div class="r-table-head region text" data-region="table-head"><!-- Column labels Názov dokumentu, Agenda, Dátum, Detail --><p style="font-size:var(--r-table-head-font);line-height:1.05;margin:0">table-head</p></div>
  <div class="r-record-one region text" data-region="record-one"><!-- First semantic record row Zmluva o dielo, Zmluvy and date --><p style="font-size:var(--r-record-one-font);line-height:1.05;margin:0">record-one</p></div>
  <div class="r-record-two region text" data-region="record-two"><!-- Second semantic record row Projektové práce, Objednávky and date --><p style="font-size:var(--r-record-two-font);line-height:1.05;margin:0">record-two</p></div>
  <div class="r-record-three region text" data-region="record-three"><!-- Third semantic record row Údržba zelene, Faktúry and date --><p style="font-size:var(--r-record-three-font);line-height:1.05;margin:0">record-three</p></div>
  <div class="r-price-title region text" data-region="price-title"><!-- Navrhovaná cena služby heading --><p style="font-size:var(--r-price-title-font);line-height:1.05;margin:0">price-title</p></div>
  <div class="r-price-copy region text" data-region="price-copy"><!-- Two-line plain service explanation; no unsupported security claim --><p style="font-size:var(--r-price-copy-font);line-height:1.05;margin:0">price-copy</p></div>
  <div class="r-price-value region text" data-region="price-value"><!-- 199 € / rok price --><p style="font-size:var(--r-price-value-font);line-height:1.05;margin:0">price-value</p></div>
  <div class="r-benefit-citizens-icon region chrome" data-region="benefit-citizens-icon"><!-- Small outline document icon on pale circular ground --></div>
  <div class="r-benefit-citizens-title region text" data-region="benefit-citizens-title"><!-- Prehľad pre občanov heading --><p style="font-size:var(--r-benefit-citizens-title-font);line-height:1.05;margin:0">benefit-citizens-title</p></div>
  <div class="r-benefit-citizens-copy region text" data-region="benefit-citizens-copy"><!-- Three lines of public document discovery support copy --><p style="font-size:var(--r-benefit-citizens-copy-font);line-height:1.05;margin:0">benefit-citizens-copy</p></div>
  <div class="r-benefit-office-icon region chrome" data-region="benefit-office-icon"><!-- Small outline people icon on pale circular ground --></div>
  <div class="r-benefit-office-title region text" data-region="benefit-office-title"><!-- Menej administratívy heading --><p style="font-size:var(--r-benefit-office-title-font);line-height:1.05;margin:0">benefit-office-title</p></div>
  <div class="r-benefit-office-copy region text" data-region="benefit-office-copy"><!-- Two lines of staff evidence support copy --><p style="font-size:var(--r-benefit-office-copy-font);line-height:1.05;margin:0">benefit-office-copy</p></div>
  <div class="r-benefit-structure-icon region chrome" data-region="benefit-structure-icon"><!-- Small outline shield icon on pale circular ground --></div>
  <div class="r-benefit-structure-title region text" data-region="benefit-structure-title"><!-- Prehľadná štruktúra heading --><p style="font-size:var(--r-benefit-structure-title-font);line-height:1.05;margin:0">benefit-structure-title</p></div>
  <div class="r-benefit-structure-copy region text" data-region="benefit-structure-copy"><!-- Three lines about clear agenda organization --><p style="font-size:var(--r-benefit-structure-copy-font);line-height:1.05;margin:0">benefit-structure-copy</p></div>
  <div class="r-navigation-ground region chrome" data-region="navigation-ground"><!-- Single solid navy navigation background spanning the screen --></div>
  <div class="r-hero-ground region chrome" data-region="hero-ground"><!-- Single solid navy hero background below navigation --></div>
  <div class="r-offer-ground region chrome" data-region="offer-ground"><!-- Single pale blue service offer background --></div>
  <div class="r-next-section-start region chrome" data-region="next-section-start"><!-- White beginning of the next workflow section at bottom of viewport --></div>
</main>
</body>
</html>
