spring.application.name=pairing-service
server.port=${SERVER_PORT:8091}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27023/openobec_read?replicaSet=rs-read&directConnection=true&serverSelectionTimeoutMS=2000}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=2000
openobec.events.topic=${OPENOBEC_EVENTS_TOPIC:openobec.documents.v1}
openobec.events.dlq=${OPENOBEC_EVENTS_DLQ:openobec.documents.v1.dlq}
openobec.pairing.group=${PAIRING_CONSUMER_GROUP:openobec-pairing-v1}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
