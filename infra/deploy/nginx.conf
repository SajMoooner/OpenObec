# Dedicated OpenObec vhosts; no changes to other sites.
map $uri $openobec_rate_key {
    default $binary_remote_addr;
    ~^/_next/static/ "";
    ~^/(icon\.svg|favicon\.ico)$ "";
}
limit_req_zone $openobec_rate_key zone=openobec_dynamic_requests:10m rate=20r/s;
server {
    listen 80;
    listen [::]:80;
    server_name openobec.sk www.openobec.sk obcan.openobec.sk uradnik.openobec.sk;
    location ^~ /.well-known/acme-challenge/ { root /var/www/openobec-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.openobec.sk;
    ssl_certificate /etc/letsencrypt/live/openobec.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openobec.sk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://openobec.sk$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name openobec.sk;
    ssl_certificate /etc/letsencrypt/live/openobec.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openobec.sk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 21m;
    access_log /var/log/nginx/openobec-access.log;
    error_log /var/log/nginx/openobec-error.log;
    add_header X-Content-Type-Options nosniff always;
    location / {
        limit_req zone=openobec_dynamic_requests burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_cookie_flags ~ secure httponly samesite=lax;
    }
}
