      context: .
      dockerfile: apps/marketing/Dockerfile
    image: openobec/marketing:demo
    restart: unless-stopped
    mem_limit: 320m
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      API_INTERNAL_URL: ${API_DOCKER_URL:-http://api-gateway:8080}
      MARKETING_PUBLIC_URL: ${MARKETING_URL:-http://localhost:3000}
      CITIZEN_PUBLIC_URL: ${CITIZEN_URL:-http://localhost:3001}
      OFFICE_PUBLIC_URL: ${OFFICE_URL:-http://localhost:3002}
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
