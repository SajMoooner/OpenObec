      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms32m -Xmx192m}
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-1200}
      INVOICES_URL: http://invoices-service:8081
      SUPPLIER_INVOICES_URL: http://supplier-invoices-service:8082
      CONTRACTS_URL: http://contracts-service:8083
      ORDERS_URL: http://orders-service:8084
