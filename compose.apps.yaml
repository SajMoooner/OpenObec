      invoices-service:
        condition: service_healthy
      supplier-invoices-service:
        condition: service_healthy
      contracts-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      procurement-service:
        condition: service_healthy
      ordinances-service:
        condition: service_healthy
      query-api:
