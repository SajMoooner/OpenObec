# App overlay; infrastructure remains in compose.yaml.
services:
  invoices-service:
    build:
      context: .
      dockerfile: services/invoices-service/Dockerfile
    image: openobec/invoices-service:demo
    restart: unless-stopped
    mem_limit: 384m
    environment:
      SERVER_PORT: '8081'
      INVOICES_SERVICE_URL: http://invoices-service:8081
      SUPPLIER_INVOICES_SERVICE_URL: http://supplier-invoices-service:8082
      CONTRACTS_SERVICE_URL: http://contracts-service:8083
      ORDERS_SERVICE_URL: http://orders-service:8084
      PROCUREMENT_SERVICE_URL: http://procurement-service:8085
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms32m -Xmx192m}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka:29092}
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://rustfs:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-openobec-demo}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-openobec-local-demo-secret}
      S3_BUCKET: ${S3_BUCKET:-openobec-documents}
      MONGODB_URI: ${MONGODB_INVOICES_INTERNAL_URI:-mongodb://mongo-invoices:27017/openobec_invoices?replicaSet=rs-invoices}
    ports:
    - 127.0.0.1:8081:8081
    depends_on:
      mongo-invoices:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - bash
      - /app/healthcheck.sh
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  supplier-invoices-service:
